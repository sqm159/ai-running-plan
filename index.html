<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NextLap · AI 中长跑训练系统</title>

  <!-- PWA: Manifest -->
  <link rel="manifest" href="https://sqm159.github.io/ai-running-plan/manifest.json?v=4" />

  <!-- PWA: 主题色 (Android 状态栏) -->
  <meta name="theme-color" content="#0C0D0D" />
  <meta name="color-scheme" content="dark" />

  <!-- PWA: iOS 全屏模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NextLap" />

  <!-- PWA: iOS 图标 -->
  <link rel="apple-touch-icon" href="./logo.png" />

  <!-- PWA: 启动画面 iOS (iPad/iPhone 自动匹配图标底色) -->
  <meta name="apple-touch-startup-image" content="#0C0D0D" />

  <!-- Favicon: 优先用你的 logo.png，浏览器标签页显示这个 (绝对路径 + 多级缓存版本) -->
  <link rel="icon" type="image/png" sizes="512x512" href="https://sqm159.github.io/ai-running-plan/logo.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="https://sqm159.github.io/ai-running-plan/logo.png?v=3" />
  <link rel="shortcut icon" type="image/png" href="https://sqm159.github.io/ai-running-plan/logo.png?v=3" />
  <!-- 国产浏览器(VIVO/OPPO/小米)最认这两个图标标签 -->
  <link rel="apple-touch-icon" href="https://sqm159.github.io/ai-running-plan/logo.png?v=3" />
  <link rel="apple-touch-icon-precomposed" href="https://sqm159.github.io/ai-running-plan/logo.png?v=3" />
  <!-- 微软/VIVO 桌面磁贴图标 -->
  <meta name="msapplication-TileImage" content="https://sqm159.github.io/ai-running-plan/logo.png?v=3" />
  <meta name="msapplication-TileColor" content="#0C0D0D" />
  <!-- Android 桌面图标能力声明 -->
  <meta name="application-name" content="NextLap" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Slogan / OG -->
  <meta name="description" content="Own your next lap. AI 驱动的中长跑训练计划生成、能力分析、训练负荷管理系统。" />
  <meta property="og:title" content="NextLap · AI 中长跑训练系统" />
  <meta property="og:description" content="Own your next lap." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./logo.png" />

  <link rel="stylesheet" href="./styles.css?v=47" />
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a class="brand" href="#/">
        <span class="brand-mark">RUN</span>
        <span>NextLap · AI 中长跑训练系统</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="#/" data-route="/">首页</a>
        <a href="#/profile" data-route="/profile">运动档案</a>
        <a href="#/performance" data-route="/performance">我的成绩</a>
        <a href="#/analysis" data-route="/analysis">能力分析</a>
        <a href="#/plan" data-route="/plan">训练计划</a>
        <a href="#/calendar" data-route="/calendar">训练日历</a>
        <a href="#/logs" data-route="/logs">训练日志</a>
        <a href="#/sync" data-route="/sync">数据同步</a>
      </div>
      <div class="nav-auth" id="navAuth"><!-- 由 app.js 根据登录状态渲染 --></div>
    </nav>
  </header>

  <!-- 路由出口：所有页面均由 app.js 渲染至此 -->
  <main id="app" class="app-root"></main>

  <footer class="site-footer">
    <p>NextLap · Own your next lap · AI 中长跑训练系统 V2.0 · 基于 Supabase 构建用户数据层</p>
  </footer>

  <!-- Supabase JS SDK（CDN，暴露 window.supabase.createClient） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Fit/FIT 二进制解析器（Garmin 等运动手表的标准活动文件格式） -->
  <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.6.0/dist/fit-file-parser.min.js"></script>
  <!-- Supabase 配置（URL + anon key，需自行填写） -->
  <script src="./supabase-config.js"></script>
  <!-- Training Load V2 · Beta (verified prototype scorer, then App adapter) -->
  <script src="./prototypes/training-load-v2-recovery.js?v=2"></script>
  <script src="./prototypes/training-load-v2-prototype.js?v=2"></script>
  <script src="./prototypes/training-load-v2-incomplete.js?v=2"></script>
  <script src="./js/training-load-v2-app.js?v=8"></script>
  <!-- 应用主逻辑 -->
  <script src="./app.js?v=48"></script>

  <!-- PWA: Service Worker 注册（localhost 手测时关闭，避免缓存旧脚本） -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        var isLocal =
          location.hostname === "localhost" || location.hostname === "127.0.0.1";
        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          console.log("[PWA] Service Worker skipped on localhost.");
          return;
        }
        navigator.serviceWorker
          .register("./service-worker.js", { scope: "./" })
          .then((reg) => {
            console.log("[PWA] Service Worker 注册成功:", reg.scope);
            if (reg.waiting) {
              reg.waiting.postMessage({ type: "SKIP_WAITING" });
            }
          })
          .catch((err) => console.warn("[PWA] Service Worker 注册失败:", err));
      });
    }
  </script>

  <!-- 微信内打开时引导用户用系统浏览器 -->
  <script>
    (function () {
      var ua = navigator.userAgent.toLowerCase();
      var isWeChat = ua.indexOf("micromessenger") !== -1;
      if (isWeChat) {
        var bar = document.createElement("div");
        bar.id = "wechat-open-browser-tip";
        bar.style.cssText =
          "position:fixed;top:0;left:0;right:0;z-index:99999;" +
          "background:#1a1a2e;color:#e0e0e0;font-size:14px;padding:10px 16px;" +
          "display:flex;align-items:center;justify-content:space-between;" +
          "box-shadow:0 2px 8px rgba(0,0,0,.5);font-family:system-ui,sans-serif;";
        bar.innerHTML =
          '<span>微信无法安装App，请点击右上角 ⋮ →「在浏览器打开」</span>' +
          '<span style="color:#4fc3f7;font-weight:bold;white-space:nowrap;margin-left:12px;cursor:pointer;" onclick="this.parentElement.remove()">关闭</span>';
        document.body.appendChild(bar);
      }
    })();
  </script>
</body>
</html>
